name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: scripts/fetch-udpipe.sh
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t learnarr:ci .
      - name: Start from an empty /config with no environment variables
        run: |
          mkdir config
          docker run -d --name learnarr -p 7979:7979 -v "$PWD/config:/config" learnarr:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7979/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:7979/api/health
          curl -fsS http://127.0.0.1:7979/api/setup/status | tee /dev/stderr | grep -q '"needsAccount":true'
          test -f config/learnarr.db
      - name: Create the first account, as the setup wizard does
        run: |
          curl -fsS -X POST http://127.0.0.1:7979/api/auth/sign-up/email \
            -H "content-type: application/json" -H "origin: http://127.0.0.1:7979" \
            -c cookies.txt -d '{"name":"Admin","email":"admin@example.com","password":"correct-horse-9"}'
          curl -fsS http://127.0.0.1:7979/api/setup/status | grep -q '"needsAccount":false'
          # Sign-up is closed once the admin exists.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7979/api/auth/sign-up/email \
            -H "content-type: application/json" -H "origin: http://127.0.0.1:7979" \
            -d '{"name":"X","email":"x@example.com","password":"correct-horse-9"}')" = "403"
          test -f config/auth.key
      - name: Download a language model on demand and lemmatise with it
        run: |
          curl -fsS -X PUT http://127.0.0.1:7979/api/me -b cookies.txt \
            -H "content-type: application/json" -H "origin: http://127.0.0.1:7979" -d '{"learningLanguage":"es"}'
          for i in $(seq 1 60); do
            curl -fsS -b cookies.txt http://127.0.0.1:7979/api/system/status > status.json
            grep -q '"code":"es"[^}]*"model":{"state":"installed"' status.json && break
            grep -q '"code":"es"[^}]*"model":{"state":"failed"' status.json && break
            sleep 5
          done
          cat status.json
          grep -q '"code":"es"[^}]*"model":{"state":"installed"' status.json
          printf 'Los gatos comen.' | docker exec -i learnarr /opt/udpipe/udpipe --tokenize --tag \
            /config/udpipe/models/spanish-ancora-ud-2.5-191206.udpipe | tee /dev/stderr | grep -q $'\tLos\tel\t'
      - if: failure()
        run: docker logs learnarr
