# Learnarr. Start it with `docker compose up -d`, then open http://<this-machine>:7979
# and the setup wizard walks you through the rest. Everything Learnarr keeps is in
# ./config: back that folder up.
services:
  learnarr:
    build: .
    container_name: learnarr
    ports:
      - "7979:7979"
    volumes:
      - ./config:/config
    environment:
      # The user and group that own ./config (`id` on the host shows yours).
      - PUID=1000
      - PGID=1000
      # Behind an HTTPS reverse proxy, its public address (turns on secure cookies):
      # - PUBLIC_URL=https://learnarr.example.com
    restart: unless-stopped
